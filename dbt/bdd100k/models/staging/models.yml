version: 2

models:
  - name: stg_clips
    description: "Cleaned clip-level metadata. One row per dashcam clip with weather, time of day, and scene attributes."
    columns:
      - name: clip_id
        description: "Unique identifier for each clip. Primary key."
        tests:
          - not_null
          - unique

      - name: time_of_day
        description: "Time of day when the clip was recorded. 'undefined' means the labeler couldn't determine."
        tests:
          - accepted_values:
              arguments:
                values: ['dawn/dusk', 'daytime', 'night', 'undefined']
      
      - name: weather
        description: "Weather conditions during clip recording. 'undefined' means the labeler couldn't determine."
        tests:
          - accepted_values:
              arguments:
                values: ['clear', 'rainy', 'snowy', 'overcast', 'partly cloudy', 'foggy', 'undefined']
      
      - name: scene_type
        description: "Setting/Environment of the clip (e.g., highway, city street, parking lot). 'undefined' means the labeler couldn't determine."
        tests:
          - accepted_values:
              arguments:
                values: ['tunnel', 'city street', 'highway', 'residential', 'gas stations', 'parking lot', 'undefined']
  

  - name: stg_objects
    description: "Cleaned object detection records. One row per detected object per clip, with bounding boxes and category attributes. Includes bike->bicycle normalization."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - clip_id
              - object_id
    columns:
      - name: clip_id
        description: "Foreign key to stg_clips. The clip this object was detected in."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_clips')
                field: clip_id
              
      - name: object_category
        description: "Type of detected object. Normalized for raw values ('bike' -> bicycle, 'motor' -> 'motorcycle')."
        tests:
          - not_null
          - accepted_values:
              arguments:
                  values: ['traffic light', 'traffic sign', 'person', 'truck', 'rider', 'car', 'bus', 'train', 'motorcycle', 'bicycle']
      
      - name: object_id
        description: "Sequential identifier for object within a clip. Not globally unique - only unique within a clip."
        tests:
          - not_null
      
      - name: is_occluded
        description: "Whether the object is partially hidden by another object."
        tests:
          - not_null

      - name: is_truncated
        description: "Whether the objects extend beyond the image frame."
        tests:
          - not_null

      - name: traffic_light_color
        description: "Color of traffic light when object_category is 'traffic light'. 'none' for all other categories."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['red', 'green', 'yellow', 'none']
              
      - name: bbox_x_min
        description: "Left edge of bounding box in pixel coordinates (x increases right)."

      - name: bbox_y_min
        description: "Top edge of bounding box in pixel coordinates (y increases down)."

      - name: bbox_x_max
        description: "Right edge of bounding box in pixel coordinates."

      - name: bbox_y_max
        description: "Bottom edge of bounding box in pixel coordinates."
  
  
  - name: stg_segmentations
    description: "Cleaned semantic segmentation records. One row per segmented region per clip. Includes lane lines, road curbs, drivable areas, and crosswalks. Lane attributes (direction, style) are NULL for non-lane segmentations."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - clip_id
              - segmentation_id
    columns:
      - name: clip_id
        description: "Foreign key to stg_clips. The clip this segmentation was identified in."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_clips')
                field: clip_id

      - name: segmentation_type
        description: "Type of segmented region (e.g., 'lane/single white', 'area/drivable', 'lane/road curb')."
        tests:
          - not_null

      - name: segmentation_id
        description: "Sequential identifier for each segmentation within a clip. Not globally unique - only unique within a clip."
        tests:
          - not_null

      - name: lane_direction
        description: "Direction of the lane line relative to vehicle ('parallel' or 'vertical'). NULL for non-lane segmentations like drivable areas."
        tests:
          - accepted_values:
              arguments:
                values: ['parallel', 'vertical']
              config:
                  where: "lane_direction is not null"
      
      - name: lane_style
        description: "Style of the lane line ('solid' or 'dashed'). NULL for non-lane segmentations."
        tests:
          - accepted_values:
              arguments:
                values: ['solid', 'dashed']
              config:
                  where: "lane_style is not null"
  

  - name: fct_clip_summary
    description: "One row per clip with all aggregated metrics. Joins clip attributes with object and segmentation counts. Designed to support labeling-pipeline coverage analysis and downstream dashboards."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - clip_id
    columns:
      - name: clip_id
        description: "Unique identifier for each clip. Primary key. Foreign key to stg_clips."
        tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('stg_clips')
                field: clip_id

      - name: time_of_day
        description: "Time of day when the clip was recorded. 'undefined' means the labeler couldn't determine."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['dawn/dusk', 'daytime', 'night', 'undefined']

      - name: weather
        description: "Weather conditions during clip recording. 'undefined' means the labeler couldn't determine."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['clear', 'rainy', 'snowy', 'overcast', 'partly cloudy', 'foggy', 'undefined']

      - name: scene_type
        description: "Setting/Environment of the clip (e.g., highway, city street, parking lot). 'undefined' means the labeler couldn't determine."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['tunnel', 'city street', 'highway', 'residential', 'gas stations', 'parking lot', 'undefined']

      - name: total_objects
        description: "Total count of all labeled objects in the clip across all categories."
        tests:
          - not_null

      - name: total_cars
        description: "Count of objects labeled 'car'. Subset of total_objects."
        tests:
          - not_null

      - name: total_trucks
        description: "Count of objects labeled 'truck'. Subset of total_objects."
        tests:
          - not_null

      - name: total_buses
        description: "Count of objects labeled 'bus'. Subset of total_objects."
        tests:
          - not_null

      - name: total_trains
        description: "Count of objects labeled 'train'. Subset of total_objects. Rare across the dataset (~136 total)."
        tests:
          - not_null

      - name: total_pedestrians
        description: "Count of objects labeled 'person'. Subset of total_objects."
        tests:
          - not_null

      - name: total_cyclists
        description: "Count of objects labeled 'rider' (humans on bicycles or motorcycles). Excludes the bikes themselves, which are labeled separately."
        tests:
          - not_null

      - name: avg_bbox_area_pixels
        description: "Mean bounding box area across all objects in the clip, in pixel² units. NULL for clips with zero objects."

      - name: total_segmentations
        description: "Total count of all labeled segmentations in the clip across all types."
        tests:
          - not_null

      - name: total_lane_lines
        description: "Count of lane-line segmentations (excludes curbs and crosswalks). Subset of total_segmentations."
        tests:
          - not_null

      - name: total_drivable_areas
        description: "Count of drivable-area segmentations (area/drivable, area/alternative, area/unknown). Subset of total_segmentations."
        tests:
          - not_null

      - name: total_pedestrian_infrastructure
        description: "Count of segmentations marking pedestrian-related road features (curbs and crosswalks). Useful for identifying clips where pedestrians could potentially appear. Subset of total_segmentations."
        tests:
          - not_null


  - name: fct_dataset_distribution
    description: "Aggregated coverage analysis at the (weather, time_of_day, scene_type) level. One row per unique environmental combination present in the dataset. Designed to surface coverage gaps and over-represented conditions for labeling pipeline decision-making."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - weather
              - time_of_day
              - scene_type
    columns:
      - name: weather
        description: "Weather condition. 'undefined' means the labeler couldn't determine."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['clear', 'rainy', 'snowy', 'overcast', 'partly cloudy', 'foggy', 'undefined']

      - name: time_of_day
        description: "Time of day. 'undefined' means the labeler couldn't determine."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['dawn/dusk', 'daytime', 'night', 'undefined']

      - name: scene_type
        description: "Setting/Environment. 'undefined' means the labeler couldn't determine."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['tunnel', 'city street', 'highway', 'residential', 'gas stations', 'parking lot', 'undefined']

      - name: clip_count
        description: "Number of clips in this environmental combination."
        tests:
          - not_null

      - name: total_objects
        description: "Total labeled objects across all clips in this combination."
        tests:
          - not_null

      - name: avg_objects_per_clip
        description: "Average number of objects per clip in this combination. Useful for comparing annotation density across conditions."
        tests:
          - not_null

      - name: pct_of_dataset
        description: "Percentage of total clips that fall into this combination. Sums to ~100 across all rows."
        tests:
          - not_null